# Builds and tests both apps on every push and pull request (ARCHITECTURE §8).
# Actions are pinned to commit SHAs; the version is in the comment.
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No signing material in the repo
        run: |
          bad=$(git ls-files | grep -Ei '\.(p12|pfx|cer|key|pem|keychain(-db)?)$' || true)
          if [ -n "$bad" ]; then
            for f in $bad; do echo "::error file=$f::Signing material must never be committed (CLAUDE.md). Remove it and replace the certificate."; done
            exit 1
          fi
      - name: VERSION matches the newest changelog entry
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          c=$(python3 -c "import json;print(json.load(open('shared/changelog.json'))[0]['version'])")
          if [ "$v" != "$c" ]; then
            echo "::error file=shared/changelog.json::The newest changelog entry is $c but VERSION is $v. Add an entry for $v."
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Test
        shell: pwsh
        working-directory: windows
        run: |
          dotnet test Screenshot.sln -c Release -p:BuildNumber=${{ github.run_number }} --logger "trx;LogFileName=results.trx" --results-directory TestResults 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Make failures visible as annotations, without opening the log.
            Select-String -Path test.log -Pattern '^\s*(Failed|error)\s' | Select-Object -First 30 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $code
          }

      - name: Build the MSIX package
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          SIGN: ${{ github.event_name != 'pull_request' }}
        run: |
          $pfx = $null
          $buildArgs = @{ BuildNumber = '${{ github.run_number }}' }
          if ($env:SIGN -eq 'true') {
            if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD -or -not $env:THUMBPRINT) {
              Write-Output "::error::Windows signing secrets are missing (docs/SIGNING.md)."; exit 1
            }
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $buildArgs.PfxPath = $pfx
            $buildArgs.PfxPassword = $env:PFX_PASSWORD
            $buildArgs.Thumbprint = $env:THUMBPRINT
          }
          try {
            & ./windows/scripts/build-msix.ps1 @buildArgs
          } catch {
            Write-Output "::error::$($_.Exception.Message)"; exit 1
          } finally {
            if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload the Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Screenshot-windows-build-${{ github.run_number }}
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: windows/TestResults
          retention-days: 7
