# Run by hand after creating the certificates (docs/SIGNING.md).
# Proves that macOS can import the .p12 and sign with it, and that Windows can sign with the .pfx
# and that its thumbprint matches the secret. Uses no third-party actions and no repo code.
name: Check signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      IDENTITY: Screenshot Signing (Ashwin Mathias)
    steps:
      - name: Import the certificate into a temporary keychain
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::MACOS_CERT_P12_BASE64 secret is missing (docs/SIGNING.md)."; exit 1; }
          [ -n "$P12_PASSWORD" ] || { echo "::error::MACOS_CERT_PASSWORD secret is missing (docs/SIGNING.md)."; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 24)
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "::error::macOS could not import the .p12. Check MACOS_CERT_PASSWORD, or re-create the certificates with tools/make-certs.sh."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities in the keychain:"
          security find-identity -p codesigning "$KC"

      - name: Sign and verify a test program
        run: |
          echo 'int main(void){return 0;}' > "$RUNNER_TEMP/t.c"
          clang -arch arm64 -arch x86_64 -o "$RUNNER_TEMP/signing-test" "$RUNNER_TEMP/t.c"
          if ! codesign --force --timestamp=none --keychain "$KC" --sign "$IDENTITY" "$RUNNER_TEMP/signing-test"; then
            echo "::error::codesign could not sign with \"$IDENTITY\"."
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/signing-test"
          codesign -d --verbose=2 "$RUNNER_TEMP/signing-test" 2>&1 | grep -E "Authority|Identifier"
          codesign -d --verbose=2 "$RUNNER_TEMP/signing-test" 2>&1 | grep -q "Authority=$IDENTITY" \
            || { echo "::error::The test program isn't signed by \"$IDENTITY\"."; exit 1; }
          echo "macOS signing works."

      - name: Remove the temporary keychain
        if: always()
        run: '[ -n "${KC:-}" ] && security delete-keychain "$KC" || true'

  windows:
    runs-on: windows-latest
    env:
      PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
    steps:
      - name: Check the certificate and sign a test program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in 'PFX_BASE64','PFX_PASSWORD','THUMBPRINT') {
            if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) {
              $s = @{PFX_BASE64='WINDOWS_CERT_PFX_BASE64';PFX_PASSWORD='WINDOWS_CERT_PASSWORD';THUMBPRINT='WINDOWS_CERT_THUMBPRINT'}[$n]
              Write-Output "::error::$s secret is missing (docs/SIGNING.md)."; exit 1
            }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)
          } catch {
            Write-Output "::error::Windows could not open the .pfx. Check WINDOWS_CERT_PASSWORD."; exit 1
          }
          Write-Output "Subject:    $($cert.Subject)"
          Write-Output "Thumbprint: $($cert.Thumbprint)"
          Write-Output "Valid:      $($cert.NotBefore) to $($cert.NotAfter)"
          if ($cert.Subject -ne 'CN=Ashwin Mathias') { Write-Output "::error::Subject must be exactly CN=Ashwin Mathias (it must match the MSIX Publisher)."; exit 1 }
          if (-not $cert.HasPrivateKey) { Write-Output "::error::The .pfx has no private key."; exit 1 }
          if ($cert.Thumbprint -ne $env:THUMBPRINT.Trim().ToUpper()) { Write-Output "::error::WINDOWS_CERT_THUMBPRINT doesn't match the certificate in the .pfx."; exit 1 }
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] }
          if (-not ($eku.EnhancedKeyUsages | Where-Object Value -eq '1.3.6.1.5.5.7.3.3')) { Write-Output "::error::The certificate isn't for code signing."; exit 1 }

          # Trust it on this throwaway runner, the way a PC trusts Screenshot-signing.cer.
          $cer = Join-Path $env:RUNNER_TEMP 'Screenshot-signing.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export('Cert'))
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Output "::error::signtool.exe not found on the runner."; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP 'signing-test.exe'
          Copy-Item "$env:WINDIR\System32\whoami.exe" $exe
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::signtool could not sign with the .pfx."; exit 1 }
          & $signtool.FullName verify /pa $exe
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::The signed test program didn't verify."; exit 1 }
          # Read the signer straight from the file's embedded signature. (Get-AuthenticodeSignature can
          # report a Windows catalog signature instead for a copied system file, so don't use it here.)
          $signer = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($exe))
          Write-Output "Signed by:  $($signer.Subject)"
          if ($signer.Thumbprint -ne $cert.Thumbprint) { Write-Output "::error::The test program is signed by a different certificate ($($signer.Subject))."; exit 1 }
          Remove-Item $pfx -Force
          Write-Output "Windows signing works."
